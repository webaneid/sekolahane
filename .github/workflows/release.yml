name: Release Theme Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Jalur 1: Otomatis via semantic-release saat push/merge ke main
  semantic-release:
    if: github.ref == 'refs/heads/main'
    name: Semantic Release (Auto Bump & Package)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/commit-analyzer@13 \
            -p @semantic-release/release-notes-generator@14 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/exec@6 \
            -p @semantic-release/git@10 \
            -p @semantic-release/github@10 \
            semantic-release

  # Jalur 2: Fallback jika tag vX.Y.Z di-push manual (kompatibel dengan pola jalawarta)
  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Package from Manual Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if release already exists (created by semantic-release)
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish release ZIP
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          mkdir -p dist
          rsync -av --exclude-from=.distignore ./ dist/sekolahane/
          cd dist
          zip -r "sekolahane-${VERSION}.zip" sekolahane
          gh release create "v${VERSION}" "sekolahane-${VERSION}.zip" \
            --title "Sekolah Ane v${VERSION}" \
            --notes "Release version ${VERSION}. Lihat CHANGELOG.md untuk rincian perubahan."
